# Wohin welche Anfrage geht.
#
# Alle Anfragen kommen über einen OnePage-Prozess ("Website-Anfrage").
# Die Kategorie wird in dieser Reihenfolge bestimmt (siehe lead.route):
#   1. `bereich`: Antwort auf die Frage `bereich_frage` (allgemeiner Fragebogen)
#   2. `fragen`:  Fragen, die nur im Fragebogen dieser Kategorie vorkommen
#   3. `match`:   Formularname / Seiten-URL
# Alles sind reguläre Ausdrücke, Groß/Klein egal. Abgeleitet aus den bisherigen
# Anfrage-Docs in "Anfragen Doks" und ihrer Ablage in monday.
#
# Spalten-IDs stammen aus monday. Fehlt eine Spalte, wird sie nicht befüllt.

drive_folder_id: 1iQDNadBBKxeeyK61jeuYfU4RLecoQYVY   # "Anfragen Doks"
